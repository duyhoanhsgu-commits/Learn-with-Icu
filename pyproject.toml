[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-contract"
version = "0.1.0"
description = "Modular RAG (Retrieval-Augmented Generation) System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "qdrant-client>=1.8.0",
    "pgvector>=0.2.5",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.1.0",
    "openai>=1.14.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
